<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    DecarboNation app icon (phase 11, 20_landing_shareables.md §6). No icon asset of any kind
    existed before this phase -- index.html's favicon referenced /vite.svg, a default Vite
    template file that was never actually present in public/ (a pre-existing dead link, not
    something this phase introduced; fixed here as part of the same pass). Simple geometric
    mark (basalt circle + chlorophyll leaf/upward curve, echoing the cover screen's "de las
    emisiones a la regeneracion" motif) rather than a photographic asset, since there is no
    design source to work from and no image-generation tool available in this environment.
    Used directly as the favicon and, via `sizes="any"`, as the PWA manifest icon too --
    sidesteps needing rasterized 192/512 PNGs (see manifest.webmanifest's own comment).
  -->
  <circle cx="32" cy="32" r="32" fill="#08100e"/>
  <path d="M16 40 C 16 24, 30 14, 48 16" fill="none" stroke="#e8613c" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M18 42 C 20 28, 32 20, 46 22" fill="none" stroke="#6fd08c" stroke-width="4" stroke-linecap="round"/>
  <circle cx="46" cy="22" r="5" fill="#6fd08c"/>
  <circle cx="22" cy="44" r="2.5" fill="#5fb3c9"/>
</svg>
